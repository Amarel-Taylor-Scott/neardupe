[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "neardupe"
version = "0.1.0"
description = "Find near-duplicate texts in a dataset with MinHash + LSH banding — dataset hygiene for training data and RAG corpora, deterministically, stdlib only."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Amarel Taylor Scott" }]
keywords = ["dedup", "minhash", "lsh", "dataset", "near-duplicate", "nlp", "llm"]
dependencies = []

[project.scripts]
neardupe = "neardupe.cli:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["neardupe"]
